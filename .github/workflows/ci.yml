Name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Code Checkout
        uses: actions/checkout@v4

      - name: Step 2 - Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Step 3 - Run Automated Tests
        run: |
          python app.py
          echo "Automated Testing Completed Successfully!"
